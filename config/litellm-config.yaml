model_list:
  # 1. Primary: Groq GPT-OSS 120B (Verified Active, Ultra-fast, $0 Free)
  - model_name: coding-fleet
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      drop_params: true

  # 2. Fallback 1: Groq Qwen 3.8 27B (Verified Active, Code Specialist, $0 Free)
  - model_name: coding-fleet
    litellm_params:
      model: groq/qwen/qwen3.8-27b
      api_key: os.environ/GROQ_API_KEY
      drop_params: true

  # 3. Fallback 2: Google Gemini 3.5 Flash Lite (Verified Active, $0 Free Tier)
  - model_name: coding-fleet
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      drop_params: true

router_settings:
  routing_strategy: "least-busy"
  fallbacks:
    - coding-fleet: ["coding-fleet"]
  model_group_alias:
    "gpt-5.6-terra": "coding-fleet"
    "gpt-4o": "coding-fleet"
    "gpt-4": "coding-fleet"
    "gpt-3.5-turbo": "coding-fleet"
    "claude-3-5-sonnet-20241022": "coding-fleet"
  num_retries: 3
  cooldown_time: 60
  allowed_fails: 1

general_settings:
  master_key: "sk-amase-master-key"

litellm_settings:
  drop_params: true
